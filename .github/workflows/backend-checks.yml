name: Backend checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder for prisma generate only. It is not a database, and this
      # job must not receive live service credentials. NODE_ENV stays unset so
      # npm ci installs the TypeScript and Jest devDependencies.
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/mawahib_build?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check production types
        run: ./node_modules/.bin/tsc -p tsconfig.build.json --noEmit --incremental false

      - name: Check application and test types
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit --incremental false

      - name: Run unit tests
        run: ./node_modules/.bin/jest --runInBand --ci
